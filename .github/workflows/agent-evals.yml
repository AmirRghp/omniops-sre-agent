name: Deterministic Agent Benchmark

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  benchmark:
    name: 25-Scenario SRE Evaluation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run 7B Benchmark (Dry-Run Simulation)
        run: |
          python -m evals.run_agent_benchmark --dry-run --model Qwen/Qwen2.5-7B-Instruct-AWQ

      - name: Run 1.5B Benchmark (Dry-Run Simulation)
        run: |
          python -m evals.run_agent_benchmark --dry-run --model Qwen/Qwen2.5-1.5B-Instruct-AWQ

      - name: Verify Model Comparison Table Output
        run: |
          python -m evals.run_agent_benchmark --compare evals/results/eval_1_5b.json evals/results/eval_7b.json
