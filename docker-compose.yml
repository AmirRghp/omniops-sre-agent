services:
  postgres:
    image: postgres:16-alpine
    container_name: omniops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-omniops}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-omniops}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - omniops-network

  langfuse:
    image: langfuse/langfuse:2
    container_name: omniops-langfuse
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-omniops}
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-my-super-secret-nextauth-key-12345}
      SALT: ${LANGFUSE_SALT:-my-super-secret-salt-12345}
      TELEMETRY_ENABLED: "false"
    ports:
      - "3000:3000"
    networks:
      - omniops-network

  init-db:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omniops-init-db
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-omniops}
      SYNC_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-omniops}
    command: ["python", "-m", "src.db.seed"]
    networks:
      - omniops-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omniops-api
    restart: unless-stopped
    depends_on:
      init-db:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-omniops}
      SYNC_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-omniops}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:8000/v1}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-Qwen/Qwen2.5-7B-Instruct-AWQ}
    ports:
      - "8000:8000"
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    networks:
      - omniops-network

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omniops-ui
    restart: unless-stopped
    depends_on:
      init-db:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-omniops}
      SYNC_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-omniops}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:8000/v1}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-Qwen/Qwen2.5-7B-Instruct-AWQ}
    ports:
      - "8001:8001"
    command: ["chainlit", "run", "app.py", "--host", "0.0.0.0", "--port", "8001"]
    networks:
      - omniops-network

  vllm:
    image: vllm/vllm-openai:latest
    container_name: omniops-vllm
    profiles:
      - gpu
    restart: unless-stopped
    ports:
      - "8002:8000"
    command:
      - "--model"
      - "${LLM_MODEL_NAME:-Qwen/Qwen2.5-7B-Instruct-AWQ}"
      - "--quantization"
      - "awq"
      - "--dtype"
      - "half"
      - "--gpu-memory-utilization"
      - "0.60"
      - "--max-model-len"
      - "8192"
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "hermes"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - omniops-network

volumes:
  postgres_data:
    name: omniops_postgres_data
  langfuse_data:
    name: omniops_langfuse_data

networks:
  omniops-network:
    name: omniops-network
    driver: bridge
